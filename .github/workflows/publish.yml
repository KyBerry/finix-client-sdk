name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: pnpm --filter @kyberry/finix-client-sdk exec tsx scripts/verify-release-tag.ts "$RELEASE_TAG"
      - name: Require a commit contained in main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Run release checks
        run: pnpm release:check
      - name: Reject an existing package version
        working-directory: packages/sdk
        run: |
          if npm view "@kyberry/finix-client-sdk@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "::error::This package version already exists on npm."
            exit 1
          fi
      - name: Publish with provenance
        working-directory: packages/sdk
        run: npm publish --access public --provenance
